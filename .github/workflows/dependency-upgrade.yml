name: Dependency upgrade validation

on:
  push:
    branches:
      - chore/html-validate-cloud-upgrade

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: chore/html-validate-cloud-upgrade
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate dependency lockfile"
            git push origin HEAD:chore/html-validate-cloud-upgrade
          else
            echo "Lockfile is already up to date."
          fi

      - name: Install from lockfile
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Record dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
