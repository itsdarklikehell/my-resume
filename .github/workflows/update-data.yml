name: Update GitHub Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Dagelijks om 06:00 UTC
  workflow_dispatch:  # Handmatig triggeren

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: pip install playwright==1.48.0

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Setup GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          gh auth status

      - name: Sync with main
        run: |
          git fetch origin
          git reset --hard origin/main
      
      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_data.py

      - name: Fetch profile data
        env:
          # Platform API keys — stored as repository secrets, never in the repo.
          HACKTHEBOX_API_KEY: ${{ secrets.HACKTHEBOX_API_KEY }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          STACK_API_KEY: ${{ secrets.STACK_API_KEY }}
          ICHIO_API_KEY: ${{ secrets.ICHIO_API_KEY }}
          # Non-secret identifiers
          STACK_USER_ID: ${{ vars.STACK_USER_ID }}
          STACKOVERFLOW_USER_ID: ${{ vars.STACKOVERFLOW_USER_ID }}
          DEVTO_USERNAME: ${{ vars.DEVTO_USERNAME }}
        run: python scripts/fetch_profile_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-data.json profile-data.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Update GitHub and profile data ($(date +%Y-%m-%d))"
            git push || true
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
