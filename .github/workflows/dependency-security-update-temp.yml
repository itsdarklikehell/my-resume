name: Generate and validate dependency security update

on:
  push:
    branches:
      - chore/upgrade-html-validate-security

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Upgrade html-validate and regenerate lockfile
        run: npm install --save-dev --save-exact html-validate@11.21.1
      - name: Verify clean reproducible install
        run: npm ci
      - name: Run project validation, unit tests and production build
        run: npm run check
      - name: Verify npm audit is clean
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('npm-audit.json','utf8')); console.log(JSON.stringify(r.metadata?.vulnerabilities)); if ((r.metadata?.vulnerabilities?.total ?? 0) > 0) process.exit(1);"
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-security-update-temp.yml
          git add package.json package-lock.json
          git commit -m "chore(deps): upgrade html-validate to patched v11"
          git push origin HEAD
