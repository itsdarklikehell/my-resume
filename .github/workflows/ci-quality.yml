name: CI Quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.23.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  lighthouse:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.23.0'
      - name: Run Lighthouse CI
        # LHCI_GITHUB_APP_TOKEN is optional; results are written to .lighthouseci/reports
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: |
          npm install -g @lhci/cli@0.14.0
          lhci autorun