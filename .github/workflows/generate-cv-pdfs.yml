name: Generate CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'profile-data.json'
      - 'github-data.json'
      - 'scripts/print-cv.mjs'
      - '.github/workflows/generate-cv-pdfs.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'profile-data.json'
      - 'github-data.json'
      - 'scripts/print-cv.mjs'
      - '.github/workflows/generate-cv-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-cv-pdfs-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build website
        run: npm run build

      - name: Copy live data files into the preview build
        run: cp profile-data.json github-data.json dist/

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cv-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/my-resume/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/my-resume/ > /dev/null
          cat /tmp/cv-preview.log

      - name: Generate Dutch and English CV PDFs
        run: CV_URL=http://127.0.0.1:4173/my-resume/ node scripts/print-cv.mjs

      - name: Commit regenerated PDFs to the source branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bauke-molenaar-cv.pdf bauke-molenaar-cv-en.pdf
          if git diff --cached --quiet; then
            echo "Committed PDFs already match the current CV."
            exit 0
          fi
          git commit -m "docs: regenerate Dutch and English CV PDFs"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git push origin "HEAD:$PR_HEAD_REF"
          else
            git push origin "HEAD:$REF_NAME"
          fi
