name: Generate CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'profile-data.json'
      - 'github-data.json'
      - 'scripts/print-cv.mjs'
      - '.github/workflows/generate-cv-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-cv-pdfs-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build website
        run: npm run build

      - name: Copy live data files into the preview build
        run: cp profile-data.json github-data.json dist/

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cv-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/my-resume/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/my-resume/ > /dev/null
          cat /tmp/cv-preview.log

      - name: Generate Dutch and English CV PDFs
        run: CV_URL=http://127.0.0.1:4173/my-resume/ node scripts/print-cv.mjs

      - name: Commit regenerated PDFs to the source branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bauke-molenaar-cv.pdf bauke-molenaar-cv-en.pdf
          if git diff --cached --quiet; then
            echo "Committed PDFs already match the current CV."
            exit 0
          fi
          git commit -m "docs: regenerate Dutch and English CV PDFs"
          TARGET_BRANCH="$REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort
              echo "::error::Could not rebase regenerated PDFs onto $TARGET_BRANCH."
              exit 1
            fi
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            echo "PDF push attempt $attempt failed; retrying after fetching $TARGET_BRANCH."
            sleep $((attempt * 2))
          done
          echo "::error::Unable to publish regenerated PDFs after 3 attempts."
          exit 1
