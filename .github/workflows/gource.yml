name: Gource visualization

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "my-resume"
          gource_resolution: "1080p"
          gource_fps: 30
          gource_auto_skip_seconds: 0.1
          gource_seconds_per_day: 0.05
          gource_time_scale: 2.0
          gource_font_size: 32
          gource_font_color: "E8EAF0"
          gource_bloom_multiplier: 0.6
          gource_bloom_intensity: 0.6
          gource_hide_items: "mouse,date"
          gource_user_scale: 1.0
          gource_dir_depth: 3
          gource_filename_time: 2.5
          gource_file_filter: '(__pycache__|\.pyc|node_modules|\.git/)'
          logo_url: "https://itsdarklikehell.github.io/my-resume/og-image.png"
          avatars_auto_fetch: true

      - name: Copy video to repo root
        run: cp ./gource/gource.mp4 ./gource.mp4

      - name: Commit and push gource.mp4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4
          git commit -m "Update gource visualization [skip ci]" || true
          git push || true
