name: Generate dependency lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/generate-dependency-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upgrade-html-validate-security
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for html-validate 11"
          git push
